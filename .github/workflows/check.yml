name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: The script parses
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\src\bindy.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Host $_.Message }; exit 1 }
      - name: PSScriptAnalyzer (errors only)
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = foreach ($folder in 'src', 'scripts') { Invoke-ScriptAnalyzer -Path $folder -Recurse -Severity Error }
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
      - name: The launcher builds
        shell: powershell
        run: ./scripts/build.ps1
