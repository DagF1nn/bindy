name: Sjekk
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Skriptet kan parses
        shell: powershell
        run: |
          $feil = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\src\bindy.ps1", [ref]$null, [ref]$feil)
          if ($feil) { $feil | ForEach-Object { Write-Host $_.Message }; exit 1 }
      - name: PSScriptAnalyzer (bare feil)
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = foreach ($mappe in 'src', 'scripts') { Invoke-ScriptAnalyzer -Path $mappe -Recurse -Severity Error }
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
      - name: Starteren bygger
        shell: powershell
        run: ./scripts/bygg.ps1
